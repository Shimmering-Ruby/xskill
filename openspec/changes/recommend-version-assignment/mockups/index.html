<script>
const COLORS = ['#0d9488','#2563eb','#7c3aed','#db2777','#ea580c','#0891b2'];
const av = (u) => {
  let h = 0; for (const c of u) h = (h * 31 + c.charCodeAt(0)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
};
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = (sha) => (sha || '').slice(0, 7);

const SKILLS = {
  'web-flask': { main: 'a1b2c3d4e5f6789012345678abcdef01', staging: 'f9e8d7c6b5a4938271605f4e3d2c1b0a', hasStaging: true },
  'sql-migrate': { main: '11223344556677889900aabbccddeeff', staging: '99887766554433221100ffeeddccbbaa', hasStaging: true },
  'git-housekeeping': { main: 'deadbeefcafebabe0123456789abcdef', staging: null, hasStaging: false },
  'pytest-fixture': { main: 'abcdef0123456789fedcba9876543210', staging: 'c0ffeeabc1234567890fedcba9876543', hasStaging: true },
  'docker-compose': { main: '13579bdf02468ace97531eca86420bdf', staging: null, hasStaging: false },
  'openapi-client': { main: '2468ace013579bdf86420bdf97531eca', staging: null, hasStaging: false },
  'log-rotate': { main: '31415926535897932384626433832795', staging: null, hasStaging: false },
  'csv-join': { main: '27182818284590452353602874713526', staging: null, hasStaging: false },
};

const USERS = ['alice', 'bob', 'carol', 'dave', 'erin', 'frank'];

const state = {
  globalPins: ['git-housekeeping'],
  sideOverrides: {
    alice: { 'web-flask': 'staging' },
    carol: { 'sql-migrate': 'main' },
  },
  userPins: {
    alice: ['pytest-fixture'],
    bob: [],
    carol: ['docker-compose'],
    dave: [],
    erin: [],
    frank: ['web-flask'],
  },
  blocked: { alice: [], bob: ['log-rotate'], carol: [], dave: [], erin: [], frank: [] },
  autoSide: {
    alice: { 'web-flask': 'staging', 'sql-migrate': 'main', 'pytest-fixture': 'main' },
    bob: { 'web-flask': 'main', 'sql-migrate': 'staging', 'pytest-fixture': 'staging' },
    carol: { 'web-flask': 'staging', 'sql-migrate': 'staging', 'pytest-fixture': 'main' },
    dave: { 'web-flask': 'main', 'sql-migrate': 'main', 'pytest-fixture': 'main' },
    erin: { 'web-flask': 'staging', 'sql-migrate': 'main', 'pytest-fixture': 'staging' },
    frank: { 'web-flask': 'main', 'sql-migrate': 'staging', 'pytest-fixture': 'main' },
  },
  histExposure: { alice: 155, bob: 98, carol: 72, dave: 41, erin: 33, frank: 120 },
  selectedUser: 'alice',
  selectedSkill: 'web-flask',
  forceSide: 'main',
  myViewUser: 'alice',
};

function resolveSide(user, skill) {
  const sk = SKILLS[skill];
  if (!sk || !sk.hasStaging) return 'main';
  const ov = (state.sideOverrides[user] || {})[skill];
  if (ov) return ov;
  return (state.autoSide[user] || {})[skill] || 'main';
}

function buildManifest(user) {
  const blocked = new Set(state.blocked[user] || []);
  const pins = [];
  for (const g of state.globalPins) {
    if (blocked.has(g) || !SKILLS[g]) continue;
    const side = resolveSide(user, g);
    pins.push({
      skill: g, side,
      sha: side === 'staging' && SKILLS[g].staging ? SKILLS[g].staging : SKILLS[g].main,
      bucket: 'pinned', source: 'global_pin',
    });
  }
  for (const p of (state.userPins[user] || [])) {
    if (blocked.has(p) || !SKILLS[p] || pins.some(x => x.skill === p)) continue;
    const side = resolveSide(user, p);
    const hasOv = !!(state.sideOverrides[user] || {})[p];
    pins.push({
      skill: p, side,
      sha: side === 'staging' && SKILLS[p].staging ? SKILLS[p].staging : SKILLS[p].main,
      bucket: 'pinned', source: hasOv ? 'admin_pin' : 'user_pin',
    });
  }
  const catalog = Object.keys(SKILLS).filter(s => !blocked.has(s) && !pins.some(x => x.skill === s));
  const mk = (s, bucket) => {
    const side = resolveSide(user, s);
    return {
      skill: s, side,
      sha: side === 'staging' && SKILLS[s].staging ? SKILLS[s].staging : SKILLS[s].main,
      bucket, source: 'auto',
    };
  };
  return [...pins, ...catalog.slice(0, 3).map(s => mk(s, 'ranked')), ...catalog.slice(3, 5).map(s => mk(s, 'recommended'))];
}

function sideChip(side) {
  return side === 'staging'
    ? '<span class="chip chip-staging">staging</span>'
    : '<span class="chip chip-main">main</span>';
}
function bucketChip(b) {
  if (b === 'pinned') return '<span class="chip chip-pin">pinned</span>';
  if (b === 'ranked') return '<span class="chip chip-ranked">ranked</span>';
  return '<span class="chip chip-rec">recommended</span>';
}
function sourceLabel(s) {
  return ({ auto: '自动', user_pin: '自 pin', admin_pin: 'admin pin', global_pin: '全局 pin' })[s] || s;
}

function renderAdmin() {
  document.getElementById('gpin-list').innerHTML = state.globalPins.map(g =>
    `<span class="chip chip-pin">${esc(g)} <button class="gpin-del btn-ghost" data-s="${esc(g)}" style="padding:0;font-size:11px">✕</button></span>`
  ).join('') || '<span class="text-slate-400">无</span>';

  document.getElementById('admin-users').innerHTML = USERS.map(u => {
    const m = buildManifest(u);
    const stg = m.filter(x => x.side === 'staging').length;
    const pins = m.filter(x => x.bucket === 'pinned').length;
    const on = state.selectedUser === u ? 'on' : '';
    return `<tr class="user-row ${on}" data-u="${esc(u)}">
      <td class="py-2.5"><span class="flex items-center gap-2"><span class="avatar" style="background:${av(u)}">${esc(u[0].toUpperCase())}</span>${esc(u)}</span></td>
      <td class="text-slate-500">0.6.29</td>
      <td class="text-right tabular-nums font-medium">${m.length}</td>
      <td class="text-right tabular-nums ${stg ? 'text-amber-700' : ''}">${stg}</td>
      <td class="text-right tabular-nums">${pins}</td>
      <td class="text-right tabular-nums text-slate-400">${state.histExposure[u]}</td>
      <td class="text-right"><button class="btn cfg-btn" data-u="${esc(u)}">配置…</button></td>
    </tr>`;
  }).join('');
  renderDrawer();
}

function renderDrawer() {
  const u = state.selectedUser;
  const box = document.getElementById('admin-drawer');
  if (!u) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const m = buildManifest(u);
  const rows = m.map(s => `
    <div class="slot-row">
      <div class="min-w-0 flex-1">
        <div class="font-medium text-[12.5px]">${esc(s.skill)}</div>
        <div class="text-[11px] text-slate-400 mt-0.5 flex flex-wrap items-center gap-1.5">
          ${bucketChip(s.bucket)} ${sideChip(s.side)}
          <code class="text-slate-400">${esc(short(s.sha))}</code>
          <span>· ${esc(sourceLabel(s.source))}</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        ${SKILLS[s.skill].hasStaging ? `
          <div class="side-tog" data-user="${esc(u)}" data-skill="${esc(s.skill)}">
            <button type="button" data-side="main" class="${s.side === 'main' ? 'on' : ''}">main</button>
            <button type="button" data-side="staging" class="${s.side === 'staging' ? 'on' : ''}">staging</button>
          </div>` : ''}
        ${s.bucket === 'pinned' && s.source !== 'global_pin'
          ? `<button class="btn unpin-btn" data-u="${esc(u)}" data-s="${esc(s.skill)}">取消 pin</button>`
          : s.source === 'global_pin'
            ? `<span class="text-[10px] text-slate-300">锁定</span>`
            : `<button class="btn pin-btn" data-u="${esc(u)}" data-s="${esc(s.skill)}">pin</button>`}
      </div>
    </div>`).join('');
  box.innerHTML = `
    <div class="flex items-baseline justify-between mb-2 flex-wrap gap-2">
      <h3 class="font-medium text-[12.5px]">${esc(u)} 的当前推送
        <span class="text-[10.5px] text-slate-400 font-normal ml-1">${m.length} 槽 · 历史曝光 ${state.histExposure[u]}（旧列，勿与当前混淆）</span>
      </h3>
      <div class="flex gap-2">
        <input id="adm-pin-input" class="ring-1 ring-slate-200 rounded-lg px-2 py-1 outline-none focus:ring-teal-500 font-mono text-[11px] w-36" placeholder="代 pin skill">
        <button id="adm-pin-add" class="btn btn-teal" data-u="${esc(u)}">代 pin</button>
      </div>
    </div>
    <div class="space-y-1.5">${rows}</div>`;
}

function renderSkills() {
  const name = state.selectedSkill;
  const sk = SKILLS[name];
  document.getElementById('sk-name').textContent = name;
  document.getElementById('sk-title').textContent = name;
  document.getElementById('sk-meta').textContent = sk.hasStaging
    ? '灰度进行中 · pick_side 默认分流 · 可被 pin 覆盖'
    : '无 staging · 全员 main';
  document.getElementById('sk-heads').innerHTML =
    `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white ring-1 ring-slate-200 text-xs font-medium text-slate-600">main <code class="text-slate-400">${esc(short(sk.main))}</code></span>`
    + (sk.staging
      ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-50 ring-1 ring-amber-200 text-xs font-medium text-amber-700"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>staging <code class="opacity-60">${esc(short(sk.staging))}</code></span>`
      : '');

  document.getElementById('sk-picker').innerHTML = Object.keys(SKILLS).map(s =>
    `<button class="btn ${s === name ? 'btn-teal' : ''} sk-pick" data-s="${esc(s)}">${esc(s)}${SKILLS[s].hasStaging ? ' · 灰度' : ''}</button>`
  ).join('');

  const stg = [], main = [];
  for (const u of USERS) {
    const hit = buildManifest(u).find(x => x.skill === name);
    if (!hit) continue;
    const row = { user: u, ...hit, overridden: !!(state.sideOverrides[u] || {})[name] };
    (hit.side === 'staging' ? stg : main).push(row);
  }
  document.getElementById('stg-count').textContent = stg.length + ' 人';
  document.getElementById('main-count').textContent = main.length + ' 人';
  const rowHtml = (list) => list.map(r => `
    <div class="slot-row">
      <span class="avatar" style="background:${av(r.user)}">${esc(r.user[0].toUpperCase())}</span>
      <div class="min-w-0 flex-1">
        <div class="font-medium">${esc(r.user)}</div>
        <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
          ${bucketChip(r.bucket)} <code>${esc(short(r.sha))}</code>
          ${r.overridden ? '<span class="chip chip-pin">已覆盖</span>' : '<span class="text-slate-400">pick_side</span>'}
        </div>
      </div>
    </div>`).join('') || '<div class="text-slate-400 text-xs py-2">无人</div>';
  document.getElementById('stg-users').innerHTML = rowHtml(stg);
  document.getElementById('main-users').innerHTML = rowHtml(main);

  document.getElementById('force-user').innerHTML = USERS.map(u =>
    `<option value="${esc(u)}"${u === state.selectedUser ? ' selected' : ''}>${esc(u)}</option>`
  ).join('');
}

function renderMy() {
  const sel = document.getElementById('my-user');
  if (!sel.options.length) {
    sel.innerHTML = USERS.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
  }
  sel.value = state.myViewUser;
  const u = state.myViewUser;
  const m = buildManifest(u);
  document.getElementById('my-sum').textContent = `${m.length} 槽`;
  document.getElementById('my-slots').innerHTML = m.map(s => `
    <div class="slot-row">
      <div class="min-w-0 flex-1">
        <div class="font-medium">${esc(s.skill)}</div>
        <div class="text-[11px] text-slate-400 mt-0.5 flex flex-wrap items-center gap-1.5">
          ${bucketChip(s.bucket)} ${sideChip(s.side)}
          <code>${esc(short(s.sha))}</code>
          <span>· ${esc(sourceLabel(s.source))}</span>
        </div>
      </div>
      ${s.bucket === 'pinned' && s.source === 'user_pin'
        ? `<button class="btn my-unpin" data-s="${esc(s.skill)}">取消 pin</button>`
        : s.bucket === 'pinned'
          ? `<span class="text-[10px] text-slate-300">锁定</span>`
          : `<button class="btn my-pin" data-s="${esc(s.skill)}">pin</button>`}
    </div>`).join('');
}

function refresh() {
  renderAdmin();
  renderSkills();
  renderMy();
}

const NAMES = { admin: '管理 · 当前推送', skills: '技能详情 · 灰度路由', my: '我的 · 自 pin' };
function go(pg) {
  document.querySelectorAll('.sec-page').forEach(el => el.classList.toggle('on', el.id === 'pg-' + pg));
  document.querySelectorAll('.nav-link').forEach(a => {
    const on = a.dataset.pg === pg;
    a.classList.toggle('active', on);
    a.classList.toggle('text-slate-500', !on);
  });
  document.getElementById('pgname').textContent = NAMES[pg] || pg;
  location.hash = pg;
}
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('[data-pg]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.pg);
});

document.body.addEventListener('click', e => {
  const row = e.target.closest('.user-row');
  if (row && !e.target.closest('button')) {
    state.selectedUser = row.dataset.u;
    refresh();
    return;
  }
  const cfg = e.target.closest('.cfg-btn');
  if (cfg) { state.selectedUser = cfg.dataset.u; refresh(); return; }

  const gd = e.target.closest('.gpin-del');
  if (gd) {
    state.globalPins = state.globalPins.filter(x => x !== gd.dataset.s);
    refresh(); return;
  }

  const skp = e.target.closest('.sk-pick');
  if (skp) { state.selectedSkill = skp.dataset.s; refresh(); return; }

  const tog = e.target.closest('.side-tog button');
  if (tog) {
    const wrap = tog.closest('.side-tog');
    if (wrap.id === 'force-side') {
      state.forceSide = tog.dataset.side;
      wrap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.side === state.forceSide));
      return;
    }
    const user = wrap.dataset.user, skill = wrap.dataset.skill, side = tog.dataset.side;
    if (!state.sideOverrides[user]) state.sideOverrides[user] = {};
    state.sideOverrides[user][skill] = side;
    if (!(state.userPins[user] || []).includes(skill) && !state.globalPins.includes(skill)) {
      state.userPins[user] = [...(state.userPins[user] || []), skill];
    }
    refresh(); return;
  }

  const pin = e.target.closest('.pin-btn');
  if (pin) {
    const u = pin.dataset.u, s = pin.dataset.s;
    if (!(state.userPins[u] || []).includes(s)) state.userPins[u] = [...(state.userPins[u] || []), s];
    refresh(); return;
  }
  const unpin = e.target.closest('.unpin-btn');
  if (unpin) {
    const u = unpin.dataset.u, s = unpin.dataset.s;
    state.userPins[u] = (state.userPins[u] || []).filter(x => x !== s);
    if (state.sideOverrides[u]) delete state.sideOverrides[u][s];
    refresh(); return;
  }

  const mypin = e.target.closest('.my-pin');
  if (mypin) {
    const u = state.myViewUser, s = mypin.dataset.s;
    if (!(state.userPins[u] || []).includes(s)) state.userPins[u] = [...(state.userPins[u] || []), s];
    refresh(); return;
  }
  const myunpin = e.target.closest('.my-unpin');
  if (myunpin) {
    const u = state.myViewUser, s = myunpin.dataset.s;
    state.userPins[u] = (state.userPins[u] || []).filter(x => x !== s);
    refresh(); return;
  }
});

document.getElementById('gpin-add').addEventListener('click', () => {
  const v = document.getElementById('gpin-input').value.trim();
  if (!v || !SKILLS[v]) return;
  if (!state.globalPins.includes(v)) state.globalPins.push(v);
  document.getElementById('gpin-input').value = '';
  refresh();
});

document.getElementById('admin-drawer').addEventListener('click', e => {
  if (e.target.id !== 'adm-pin-add') return;
  const u = e.target.dataset.u;
  const v = document.getElementById('adm-pin-input').value.trim();
  if (!v || !SKILLS[v]) return;
  if (!(state.userPins[u] || []).includes(v)) state.userPins[u] = [...(state.userPins[u] || []), v];
  refresh();
});

document.getElementById('force-pin').addEventListener('click', () => {
  const u = document.getElementById('force-user').value;
  const skill = state.selectedSkill;
  if (!SKILLS[skill].hasStaging && state.forceSide === 'staging') return;
  if (!state.sideOverrides[u]) state.sideOverrides[u] = {};
  state.sideOverrides[u][skill] = state.forceSide;
  if (!(state.userPins[u] || []).includes(skill) && !state.globalPins.includes(skill)) {
    state.userPins[u] = [...(state.userPins[u] || []), skill];
  }
  state.selectedUser = u;
  refresh();
});
document.getElementById('force-clear').addEventListener('click', () => {
  const u = document.getElementById('force-user').value;
  const skill = state.selectedSkill;
  if (state.sideOverrides[u]) delete state.sideOverrides[u][skill];
  refresh();
});

document.getElementById('my-user').addEventListener('change', e => {
  state.myViewUser = e.target.value;
  refresh();
});
document.getElementById('my-pin-add').addEventListener('click', () => {
  const v = document.getElementById('my-pin-input').value.trim();
  const u = state.myViewUser;
  if (!v || !SKILLS[v]) return;
  if (!(state.userPins[u] || []).includes(v)) state.userPins[u] = [...(state.userPins[u] || []), v];
  document.getElementById('my-pin-input').value = '';
  refresh();
});

const init = (location.hash || '#admin').slice(1) || 'admin';
go(['admin', 'skills', 'my'].includes(init) ? init : 'admin');
refresh();

</script>
</body></html>
