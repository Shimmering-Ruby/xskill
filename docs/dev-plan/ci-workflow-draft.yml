# Draft of .github/workflows/ci.yml — supersedes the current single-OS gated workflow.
# This file is documentation; once P1 lands it will replace .github/workflows/ci.yml.
#
# Trigger matrix (see docs/dev-plan/testing-strategy.md §2):
#   - pull_request   → ut+it (3 OS × 2 py) + smoke-e2e (3 OS × 3 agent)
#   - push to main   → same + real-llm-e2e (Linux only)
#   - workflow_dispatch / schedule → also live-agent-e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # nightly UTC 16:00

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ut-it:
    name: ut+it (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Normalize line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run UT + IT
        # Excludes tests under tests/e2e/ (covered by smoke-e2e job).
        run: pytest tests/ --ignore=tests/e2e -q

  smoke-e2e:
    name: smoke-e2e (${{ matrix.os }}, ${{ matrix.agent }})
    needs: ut-it
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        agent: [claude_code, codex, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Smoke E2E (no real LLM)
        env:
          XSKILL_E2E_AGENT: ${{ matrix.agent }}
        run: pytest tests/e2e/test_smoke.py -q -k "${{ matrix.agent }}"

  real-llm-e2e:
    # Only on push-to-main / nightly / manual; needs API key secret.
    name: real-llm-e2e (linux)
    if: github.event_name != 'pull_request'
    needs: smoke-e2e
    runs-on: ubuntu-latest
    continue-on-error: true  # do not block main on flaky external API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Real-LLM E2E
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_API_KEY:      ${{ secrets.ARK_API_KEY }}
        run: pytest tests/e2e/test_real_llm.py -q

  live-agent-e2e:
    # Manual + nightly only. Installs real coding agents and runs end-to-end.
    # Per-agent steps are stubs until P2/P3 ship live-agent test fixtures.
    name: live-agent-e2e
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: real-llm-e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "Live-agent E2E placeholder — implemented in a later phase."

  verify-build:
    name: verify-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
