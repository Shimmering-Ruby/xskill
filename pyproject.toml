[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xskill"
version = "0.3.0"
description = "Distill reusable Skills from AI Agent execution trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "370025263", email = "370025263@qq.com" }]
keywords = ["agent", "skill", "trajectory", "llm", "rag", "self-evolving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "huggingface-hub>=0.17",
    "openai>=1.0",
    "agno",
    "tqdm",
    "httpx",
    "fastapi",
    "uvicorn",
    "sse-starlette",
]

[project.urls]
Homepage = "https://github.com/370025263/xskill"
Repository = "https://github.com/370025263/xskill"
Issues = "https://github.com/370025263/xskill/issues"

[project.scripts]
xskill = "xskill.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xskill = ["web/dist/**/*"]
